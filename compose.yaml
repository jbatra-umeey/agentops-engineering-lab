services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      AGENTOPS_DB: /app/data/agentops.db
    volumes:
      - agentops_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  agentops_data:
